services:
  - type: web
    name: universal-codeforge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FREE_LLM_API_URL
        sync: false
      - key: FREE_LLM_API_KEY
        sync: false
      - key: FREE_LLM_API_WIRE_API
        value: chat_completions
      - key: FREE_LLM_API_TIMEOUT
        value: "120"
      - key: FREE_LLM_API_MAX_RETRIES
        value: "1"
      - key: DEFAULT_MODEL
        value: auto:balanced
      - key: PLANNING_MODEL
        value: auto:smart
      - key: CODING_MODEL
        value: auto:balanced
      - key: REVIEW_MODEL
        value: auto:smart
      - key: DEBUG_MODEL
        value: auto:reliable
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: REQUEST_MAX_BODY_MB
        value: "10"
      - key: PYTHON_VERSION
        value: 3.11.0
